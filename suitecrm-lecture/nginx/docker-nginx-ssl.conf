# ==============================================================================
# Nginx HTTPS / SSL Server Block for SuiteCRM 8 (Docker Engine Deployment)
# Serves SuiteCRM over port 443 with modern TLS and reverse proxy settings.
# ==============================================================================

server {
    listen 443 ssl;
    server_name _; # Wildcard / Default Catch-All: matches any domain or IP

    # --- SSL certificate paths ---
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # --- Modern TLS configuration ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    # --- SSL session cache for performance ---
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- HSTS (HTTP Strict Transport Security) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Batas upload file 50 MB (untuk proposal PDF, avatar, import data, modul CRM)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/suitecrm_ssl_access.log;
    error_log /var/log/nginx/suitecrm_ssl_error.log;

    # 1. Routing Utama ke SuiteCRM 8 (Container: suitecrm:8080)
    location / {
        proxy_pass http://suitecrm:8080;
        proxy_http_version 1.1;

        # Header identitas proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket & Upgrade header untuk Angular SPA SuiteCRM 8
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout aman untuk laporan CRM berat
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
