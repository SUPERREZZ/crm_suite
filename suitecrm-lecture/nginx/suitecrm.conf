# ==============================================================================
# Nginx Reverse Proxy Configuration for SuiteCRM 8 (Host OS / VPS Installation)
# PT Sumber Kopi Nusantara - Cloud Deployment
# ==============================================================================

server {
    listen 80;
    server_name _; # Wildcard / Catch-All: otomatis menerima domain bawaan Jagoan Cloud apa pun

    # Batas ukuran upload file untuk dokumen proposal, avatar, lampiran email, & paket bahasa
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/suitecrm_access.log;
    error_log /var/log/nginx/suitecrm_error.log;

    location / {
        # Mengarahkan traffic ke container SuiteCRM pada port 8080 localhost
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Header standar reverse proxy agar SuiteCRM mengetahui IP & skema klien sebenarnya
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Dukungan WebSocket & Upgrade header untuk Angular SPA
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout yang aman untuk query laporan atau import data berat
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
