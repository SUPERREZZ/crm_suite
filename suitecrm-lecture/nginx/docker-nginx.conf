# ==============================================================================
# Nginx Reverse Proxy for SuiteCRM 8 (Docker Engine Deployment) - HTTP Port 80
# Cocok untuk Domain Bawaan Jagoan Cloud (*.jagoancloud.com / IP VPS)
# ==============================================================================

server {
    listen 80;
    server_name _; # Wildcard / Default Catch-All: otomatis menerima domain apa pun

    # ACME challenge for Let's Encrypt certificate issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Batas upload file 50 MB (untuk proposal PDF, avatar, import data, modul CRM)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/suitecrm_access.log;
    error_log /var/log/nginx/suitecrm_error.log;

    # Opsional: Jika ingin selalu redirect HTTP ke HTTPS secara otomatis,
    # hapus tanda pagar (#) pada baris di bawah:
    # return 301 https://$host$request_uri;

    # 1. Routing Utama ke SuiteCRM 8 (Container: suitecrm:8080)
    location / {
        proxy_pass http://suitecrm:8080;
        proxy_http_version 1.1;

        # Header identitas proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Upgrade header untuk Angular SPA SuiteCRM 8
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout aman untuk laporan CRM berat
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
